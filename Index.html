<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locais Finder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 16px;
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 24px; font-size: 26px; }
        .box {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            border-left: 4px solid #c62828;
        }
        .error.show { display: block; }
        .card {
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-name { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
        .card-address { font-size: 13px; color: #666; margin-bottom: 8px; line-height: 1.4; }
        .badge { 
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            margin-right: 6px;
        }
        .results { display: none; }
        .results.show { display: block; }
        .count { color: white; margin-bottom: 16px; font-size: 14px; }
        .empty { text-align: center; color: white; padding: 40px 16px; }
        .loader { text-align: center; color: white; display: none; }
        .loader.show { display: block; margin-bottom: 20px; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .info { background: #e3f2fd; color: #1976d2; padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 16px; border-left: 4px solid #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Locais Finder</h1>

        <div class="box">
            <div class="error" id="erro"></div>

            <div class="form-group">
                <label>📍 Localidade</label>
                <input 
                    type="text" 
                    id="local" 
                    placeholder="Ex: Curitiba, São Paulo, Paris..."
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label>🏷️ Categoria</label>
                <select id="categoria">
                    <option value="">Selecione...</option>
                    <option value="cafe">☕ Cafeteria</option>
                    <option value="restaurant">🍽️ Restaurante</option>
                    <option value="bar">🍺 Bar</option>
                    <option value="hotel">🏨 Hotel</option>
                    <option value="hospital">🏥 Hospital</option>
                    <option value="pharmacy">💊 Farmácia</option>
                    <option value="bank">🏦 Banco</option>
                    <option value="atm">🏧 Caixa Eletrônico</option>
                </select>
            </div>

            <div class="form-group">
                <label>📏 Raio (km)</label>
                <input type="number" id="raio" value="5" min="1" max="50">
            </div>

            <button onclick="buscar()">🔍 Buscar</button>
            
            <div class="info">ℹ️ Dados obtidos do OpenStreetMap (comunidade global)</div>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Buscando locais próximos...</p>
        </div>

        <div class="results" id="results">
            <div class="count" id="count"></div>
            <div id="lista"></div>
        </div>

        <div class="empty" id="vazio">
            <p>📭 Nenhum local encontrado</p>
        </div>
    </div>

    <script>
        const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';
        const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';

        const categoriasTags = {
            'cafe': ['amenity=cafe', 'amenity=coffee'],
            'restaurant': ['amenity=restaurant'],
            'bar': ['amenity=bar'],
            'hotel': ['tourism=hotel'],
            'hospital': ['amenity=hospital'],
            'pharmacy': ['amenity=pharmacy'],
            'bank': ['amenity=bank'],
            'atm': ['amenity=atm']
        };

        async function buscar() {
            const local = document.getElementById('local').value.trim();
            const categoria = document.getElementById('categoria').value;
            const raio = parseInt(document.getElementById('raio').value);

            if (!local || !categoria) {
                mostrarErro('Preencha localidade e categoria');
                return;
            }

            mostrarLoader(true);
            document.getElementById('vazio').style.display = 'none';
            document.getElementById('results').classList.remove('show');
            document.getElementById('erro').classList.remove('show');

            try {
                // Passo 1: Geocodificar localidade com Nominatim
                console.log('Buscando localidade:', local);
                const geoResponse = await fetch(
                    `${NOMINATIM_URL}?q=${encodeURIComponent(local)}&format=json&limit=1`,
                    { headers: { 'Accept': 'application/json' } }
                );
                const geoData = await geoResponse.json();

                if (!geoData || geoData.length === 0) {
                    mostrarErro('Localidade não encontrada. Tente outro nome.');
                    mostrarLoader(false);
                    return;
                }

                const lat = parseFloat(geoData[0].lat);
                const lng = parseFloat(geoData[0].lon);
                console.log('Coordenadas:', lat, lng);

                // Passo 2: Buscar locais com Overpass API
                const tags = categoriasTags[categoria];
                const bbox = `${lat - (raio/111)},${lng - (raio/111)},${lat + (raio/111)},${lng + (raio/111)}`;
                
                let query = `[bbox:${bbox}];(`;
                tags.forEach(tag => {
                    query += `node[${tag}];way[${tag}];`;
                });
                query += `);out center;`;

                console.log('Query Overpass:', query);

                const placesResponse = await fetch(OVERPASS_URL, {
                    method: 'POST',
                    body: query,
                    headers: { 'Content-Type': 'application/osm3s' }
                });

                const placesText = await placesResponse.text();
                const places = parseOverpassData(placesText);

                if (!places || places.length === 0) {
                    document.getElementById('vazio').style.display = 'block';
                    mostrarLoader(false);
                    return;
                }

                // Calcular distância e ordenar
                const placesComDistancia = places.map(p => ({
                    ...p,
                    distancia: calcularDistancia(lat, lng, p.lat, p.lng)
                })).sort((a, b) => a.distancia - b.distancia);

                mostrarResultados(placesComDistancia);
                mostrarLoader(false);

            } catch (err) {
                console.error('Erro:', err);
                mostrarErro('Erro ao buscar. Tente novamente.');
                mostrarLoader(false);
            }
        }

        function parseOverpassData(text) {
            const places = [];
            const lines = text.split('\n');
            
            let currentPlace = null;
            for (let line of lines) {
                line = line.trim();
                
                if (line.startsWith('node') || line.startsWith('way')) {
                    if (currentPlace && currentPlace.nome) {
                        places.push(currentPlace);
                    }
                    currentPlace = { nome: '', lat: 0, lng: 0 };
                }
                
                if (line.startsWith('center lat')) {
                    const match = line.match(/lat="([\d.-]+)" lon="([\d.-]+)"/);
                    if (match) {
                        currentPlace.lat = parseFloat(match[1]);
                        currentPlace.lng = parseFloat(match[2]);
                    }
                }
                
                if (line.startsWith('tag k="name"')) {
                    const match = line.match(/v="([^"]+)"/);
                    if (match) {
                        currentPlace.nome = match[1];
                    }
                }
            }
            
            if (currentPlace && currentPlace.nome) {
                places.push(currentPlace);
            }
            
            return places;
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function mostrarResultados(locais) {
            document.getElementById('count').textContent = `✅ ${locais.length} local(is) encontrado(s)`;
            document.getElementById('results').classList.add('show');

            const lista = document.getElementById('lista');
            lista.innerHTML = '';

            locais.forEach(place => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-name">${place.nome}</div>
                    <div class="card-address">
                        📍 ${place.distancia.toFixed(2)} km de distância
                    </div>
                    <div>
                        <span class="badge">🌍 OpenStreetMap</span>
                    </div>
                `;
                lista.appendChild(card);
            });
        }

        function mostrarErro(msg) {
            const e = document.getElementById('erro');
            e.textContent = msg;
            e.classList.add('show');
        }

        function mostrarLoader(show) {
            document.getElementById('loader').classList.toggle('show', show);
        }

        document.getElementById('local').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscar();
        });
    </script>
</body>
</html>
