<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locais Finder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea,#764ba2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px;min-height:100vh}
.container{max-width:600px;margin:0 auto}
h1{color:#fff;text-align:center;margin-bottom:18px;font-size:24px}
.box{background:#fff;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 8px 28px rgba(0,0,0,.16)}
.fg{margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
input,select{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#667eea}
gmp-place-autocomplete{width:100%;display:block}
button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:12px;border-radius:8px;margin-bottom:14px;font-size:14px;display:none;line-height:1.45}
.msg.show{display:block}
.err{background:#ffebee;color:#c62828}
.ok{background:#e8f5e9;color:#2e7d32}
.card{background:#fff;padding:14px;margin-bottom:10px;border-radius:10px;border-left:4px solid #667eea;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pos{display:inline-block;background:#667eea;color:#fff;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:13px;font-size:13px;font-weight:700;margin-right:8px;padding:0 6px}
.nome{font-weight:600;font-size:16px}
.end{font-size:13px;color:#666;margin:6px 0 8px}
.badge{display:inline-block;background:#f0f0f0;padding:4px 8px;border-radius:4px;font-size:12px;margin-right:6px;color:#444}
.destaque{background:#e8eaf6;color:#3949ab;font-weight:600}
.count{color:#fff;margin-bottom:12px;font-size:14px}
.loader{text-align:center;color:#fff;display:none}
.loader.show{display:block}
.spin{border:3px solid rgba(255,255,255,.3);border-top:3px solid #fff;border-radius:50%;width:38px;height:38px;animation:s 1s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
a.maps{color:#4285F4;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <h1>🔍 Locais Finder</h1>

  <div class="box">
    <div class="msg err" id="erro"></div>

    <div class="fg">
      <label>📍 Ponto de referência</label>
      <div id="acbox"></div>
    </div>

    <div class="fg">
      <label>🏷️ Categoria</label>
      <select id="categoria">
        <option value="cafe">☕ Cafeteria</option>
        <option value="restaurant">🍽️ Restaurante</option>
        <option value="bakery">🥐 Padaria</option>
        <option value="bar">🍺 Bar</option>
        <option value="hotel">🏨 Hotel</option>
        <option value="gym">💪 Academia</option>
        <option value="park">🌳 Parque</option>
        <option value="supermarket">🛒 Supermercado</option>
        <option value="pharmacy">💊 Farmácia</option>
        <option value="shopping_mall">🛍️ Shopping</option>
      </select>
    </div>

    <div class="fg">
      <label>📏 Raio (km)</label>
      <input type="number" id="raio" value="5" min="1" max="50">
    </div>

    <button id="btn" disabled>Carregando…</button>
  </div>

  <div class="loader" id="loader"><div class="spin"></div><p>Buscando…</p></div>
  <div id="count" class="count"></div>
  <div id="lista"></div>
</div>

<script>
const API_KEY = 'AIzaSyBHMhqA68bmKHz9sAcx0uTJTNJHc6DdGjo';

let Place, SearchNearbyRankPreference, centro = null, nomeRef = '';

function erro(msg){ const e=document.getElementById('erro'); e.innerHTML=msg; e.classList.add('show'); }
function limpaErro(){ document.getElementById('erro').classList.remove('show'); }
function loader(v){
  document.getElementById('loader').classList.toggle('show', v);
  document.getElementById('btn').disabled = v;
}

(function carregarMaps(){
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + API_KEY + '&v=weekly&libraries=places&language=pt-BR&loading=async&callback=initApp';
  s.async = true;
  s.onerror = function(){ erro('Não foi possível carregar o Google Maps.'); };
  document.head.appendChild(s);
})();

window.initApp = async function(){
  try{
    const places = await google.maps.importLibrary('places');
    Place = places.Place;
    SearchNearbyRankPreference = places.SearchNearbyRankPreference;

    const ac = new places.PlaceAutocompleteElement();
    document.getElementById('acbox').appendChild(ac);

    async function onSelect(ev){
      limpaErro();
      const pred = ev.placePrediction || (ev.detail && ev.detail.placePrediction);
      if(!pred) return;
      const place = pred.toPlace();
      await place.fetchFields({fields:['location','displayName','formattedAddress']});
      centro = place.location;
      nomeRef = place.displayName || place.formattedAddress || '';
    }
    ac.addEventListener('gmp-select', onSelect);
    ac.addEventListener('gmp-placeselect', onSelect);

    const btn = document.getElementById('btn');
    btn.textContent = 'Buscar ranking';
    btn.disabled = false;
    btn.addEventListener('click', buscar);
  }catch(e){
    erro('Erro ao iniciar: ' + e.message);
  }
};

async function buscar(){
  limpaErro();
  document.getElementById('lista').innerHTML = '';
  document.getElementById('count').textContent = '';

  if(!centro){
    erro('Escolha um ponto de referência na lista de sugestões.');
    return;
  }

  const tipo = document.getElementById('categoria').value;
  const raio = Math.min(50, Math.max(1, parseInt(document.getElementById('raio').value)||5)) * 1000;

  loader(true);
  try{
    const req = {
      fields: ['displayName','formattedAddress','location','rating','userRatingCount','id'],
      locationRestriction: { center: centro, radius: raio },
      includedPrimaryTypes: [tipo],
      maxResultCount: 20,
      rankPreference: SearchNearbyRankPreference.POPULARITY,
      language: 'pt-BR'
    };
    const { places } = await Place.searchNearby(req);
    loader(false);

    if(!places || !places.length){
      erro('Nenhum local encontrado nesse raio. Tente aumentar o raio.');
      return;
    }

    const lista = places.slice();
    lista.sort(function(a,b){ return (b.userRatingCount||0) - (a.userRatingCount||0); });
    render(lista);
  }catch(e){
    loader(false);
    const m = (e && e.message) ? e.message : String(e);
    if(m.indexOf('PERMISSION_DENIED') >= 0 || m.indexOf('disabled') >= 0 || m.indexOf('403') >= 0){
      erro('A <b>Places API (New)</b> ainda não está ativada neste projeto. Ative e aguarde 1–2 minutos.<br><br><small>' + m + '</small>');
    }else{
      erro('Erro na busca: ' + m);
    }
  }
}

function render(locais){
  document.getElementById('count').textContent =
    locais.length + ' locais perto de ' + nomeRef + ' — do mais avaliado ao menos avaliado';

  let html = '';
  for(var i=0;i<locais.length;i++){
    const p = locais[i];
    const total = p.userRatingCount || 0;
    const nota = p.rating ? p.rating.toFixed(1) : '—';
    const nome = p.displayName || '(sem nome)';
    const end = p.formattedAddress || '';
    const url = 'https://www.google.com/maps/search/?api=1&query=' +
                encodeURIComponent(nome) + '&query_place_id=' + p.id;
    html += '<div class="card">' +
      '<div><span class="pos">' + (i+1) + '</span><span class="nome">' + nome + '</span></div>' +
      '<div class="end">' + end + '</div>' +
      '<div><span class="badge destaque">💬 ' + total + ' avaliações</span>' +
      '<span class="badge">⭐ ' + nota + '</span></div>' +
      '<div style="margin-top:8px"><a class="maps" href="' + url + '" target="_blank">Abrir no Google Maps →</a></div>' +
      '</div>';
  }
  document.getElementById('lista').innerHTML = html;
}
</script>
</body>
</html>
